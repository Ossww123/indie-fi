<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">IndieFi 핵심 도메인 모델</title>
  <desc id="desc">사용자, 게임, 키 배포, 암호화 게임 키, 지급, 크레딧 원장, 리뷰 요청, 배정, 피드백 제출, 품질 평가의 축약 관계 모델이다.</desc>
  <defs>
    <marker id="erd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#9a8b7c"/></marker>
    <filter id="erd-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".09"/></filter>
    <style>
      .title{font:700 30px "Noto Sans KR","Malgun Gothic",Inter,Segoe UI,sans-serif;fill:#241d18}.subtitle{font:14px "Noto Sans KR","Malgun Gothic",Inter,Segoe UI,sans-serif;fill:#75695e}
      .group{fill:#fbf5e9;stroke:#ddcdb7;stroke-width:1.5}.group-title{font:700 13px "Noto Sans KR","Malgun Gothic",Inter,Segoe UI,sans-serif;letter-spacing:1px;fill:#8b6b52}
      .table{fill:#fffdf8;stroke:#d4c2aa;stroke-width:1.5;filter:url(#erd-shadow)}.table-head{fill:#2b2520}.table-head-accent{fill:#c94332}
      .name{font:700 15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#fffaf1}.field{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#534a42}.note{font:11px "Noto Sans KR","Malgun Gothic",Inter,Segoe UI,sans-serif;fill:#8b7562}
      .rel{fill:none;stroke:#9a8b7c;stroke-width:1.7;marker-end:url(#erd-arrow)}.rel-accent{fill:none;stroke:#c94332;stroke-width:2.2;marker-end:url(#erd-arrow)}
      .badge{fill:#efe2ce}.badge-text{font:700 10px "Noto Sans KR","Malgun Gothic",Inter,Segoe UI,sans-serif;letter-spacing:.3px;fill:#765b48}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#f6ecdc"/>
  <text x="54" y="56" class="title">핵심 도메인 모델</text>
  <text x="54" y="82" class="subtitle">축약 관계도 · PostgreSQL 외래 키, UNIQUE 인덱스, CHECK 제약조건으로 관계와 불변식을 강제한다</text>

  <rect x="38" y="108" width="650" height="744" rx="22" class="group"/>
  <text x="62" y="140" class="group-title">게임 키 한정 배포</text>
  <rect x="712" y="108" width="650" height="744" rx="22" class="group"/>
  <text x="736" y="140" class="group-title">크레딧 기반 리뷰 순환</text>

  <!-- left-side tables -->
  <g transform="translate(72 180)"><rect width="220" height="132" rx="12" class="table"/><path d="M12 0h196a12 12 0 0 1 12 12v32H0V12A12 12 0 0 1 12 0" class="table-head"/><text x="16" y="28" class="name">users</text><text x="16" y="68" class="field">PK id</text><text x="16" y="90" class="field">credit_balance</text><text x="16" y="112" class="note">원장 기반 캐시 잔액</text></g>
  <g transform="translate(388 180)"><rect width="230" height="132" rx="12" class="table"/><path d="M12 0h206a12 12 0 0 1 12 12v32H0V12A12 12 0 0 1 12 0" class="table-head"/><text x="16" y="28" class="name">games</text><text x="16" y="68" class="field">PK id</text><text x="16" y="90" class="field">FK owner_id → users</text><text x="16" y="112" class="field">title · genre_id</text></g>
  <g transform="translate(388 384)"><rect width="230" height="154" rx="12" class="table"/><path d="M12 0h206a12 12 0 0 1 12 12v32H0V12A12 12 0 0 1 12 0" class="table-head-accent"/><text x="16" y="28" class="name">key_drops</text><text x="16" y="68" class="field">PK id</text><text x="16" y="90" class="field">FK game_id → games</text><text x="16" y="112" class="field">FK owner_id → users</text><text x="16" y="134" class="field">opens_at · state_version</text></g>
  <g transform="translate(72 592)"><rect width="238" height="176" rx="12" class="table"/><path d="M12 0h214a12 12 0 0 1 12 12v32H0V12A12 12 0 0 1 12 0" class="table-head"/><text x="16" y="28" class="name">game_keys</text><text x="16" y="68" class="field">PK id</text><text x="16" y="90" class="field">FK drop_id → key_drops</text><text x="16" y="112" class="field">ciphertext · nonce</text><text x="16" y="134" class="field">authentication_tag</text><text x="16" y="156" class="note">AES-GCM으로 저장 시 보호</text></g>
  <g transform="translate(388 592)"><rect width="230" height="176" rx="12" class="table"/><path d="M12 0h206a12 12 0 0 1 12 12v32H0V12A12 12 0 0 1 12 0" class="table-head-accent"/><text x="16" y="28" class="name">key_grants</text><text x="16" y="68" class="field">PK id</text><text x="16" y="90" class="field">FK drop_id → key_drops</text><text x="16" y="112" class="field">FK user_id → users</text><text x="16" y="134" class="field">FK key_id → game_keys</text><text x="16" y="156" class="note">UNIQUE(drop,user) · UNIQUE(key)</text></g>

  <path d="M388 246H292" class="rel"/><path d="M503 384V312" class="rel-accent"/><path d="M191 592C240 510 310 456 388 456" class="rel"/><path d="M503 592V538" class="rel-accent"/><path d="M388 680H310" class="rel-accent"/><path d="M430 592C278 560 148 430 165 312" class="rel"/>
  <rect x="310" y="220" width="57" height="21" rx="7" class="badge"/><text x="338" y="235" text-anchor="middle" class="badge-text">소유</text>

  <!-- right-side tables -->
  <g transform="translate(744 180)"><rect width="254" height="154" rx="12" class="table"/><path d="M12 0h230a12 12 0 0 1 12 12v32H0V12A12 12 0 0 1 12 0" class="table-head"/><text x="16" y="28" class="name">credit_ledger_entries</text><text x="16" y="68" class="field">PK id</text><text x="16" y="90" class="field">FK user_id → users</text><text x="16" y="112" class="field">kind · delta · created_at</text><text x="16" y="134" class="note">추가 전용 잔액 원장</text></g>
  <g transform="translate(1076 180)"><rect width="254" height="176" rx="12" class="table"/><path d="M12 0h230a12 12 0 0 1 12 12v32H0V12A12 12 0 0 1 12 0" class="table-head-accent"/><text x="16" y="28" class="name">review_requests</text><text x="16" y="68" class="field">PK id · FK game_id</text><text x="16" y="90" class="field">FK requester_id → users</text><text x="16" y="112" class="field">FK spend_entry_id → ledger</text><text x="16" y="134" class="field">refund_entry_id · status</text><text x="16" y="156" class="note">멱등 생성 작업</text></g>
  <g transform="translate(1076 424)"><rect width="254" height="176" rx="12" class="table"/><path d="M12 0h230a12 12 0 0 1 12 12v32H0V12A12 12 0 0 1 12 0" class="table-head"/><text x="16" y="28" class="name">review_assignments</text><text x="16" y="68" class="field">PK id</text><text x="16" y="90" class="field">FK request_id → requests</text><text x="16" y="112" class="field">FK reviewer_id → users</text><text x="16" y="134" class="field">status · leased_until</text><text x="16" y="156" class="note">SKIP LOCKED 선점 · 임대</text></g>
  <g transform="translate(744 650)"><rect width="254" height="176" rx="12" class="table"/><path d="M12 0h230a12 12 0 0 1 12 12v32H0V12A12 12 0 0 1 12 0" class="table-head-accent"/><text x="16" y="28" class="name">feedback_submissions</text><text x="16" y="68" class="field">PK id</text><text x="16" y="90" class="field">FK assignment_id → assignment</text><text x="16" y="112" class="field">FK reviewer_id → users</text><text x="16" y="134" class="field">FK earn_entry_id → ledger</text><text x="16" y="156" class="note">UNIQUE(assignment) · 최소 길이</text></g>
  <g transform="translate(1076 650)"><rect width="254" height="176" rx="12" class="table"/><path d="M12 0h230a12 12 0 0 1 12 12v32H0V12A12 12 0 0 1 12 0" class="table-head"/><text x="16" y="28" class="name">feedback_ratings</text><text x="16" y="68" class="field">PK id</text><text x="16" y="90" class="field">FK submission_id → feedback</text><text x="16" y="112" class="field">FK rater_id → users</text><text x="16" y="134" class="field">score · revision</text><text x="16" y="156" class="note">피드백당 수정 가능 평가 1개</text></g>

  <path d="M1076 257H998" class="rel-accent"/><path d="M1203 424V356" class="rel-accent"/><path d="M998 697C1040 660 1085 630 1123 600" class="rel-accent"/><path d="M1076 738H998" class="rel"/>
  <path d="M744 257C650 250 530 250 292 250" class="rel"/>
  <path d="M855 650C840 560 860 470 871 334" class="rel"/>
  <path d="M1076 258C940 210 710 242 618 246" class="rel"/>
  <path d="M1076 512C950 494 590 436 292 270" class="rel"/>
  <rect x="1013" y="226" width="49" height="21" rx="7" class="badge"/><text x="1037" y="241" text-anchor="middle" class="badge-text">차감</text>
  <rect x="861" y="515" width="43" height="21" rx="7" class="badge"/><text x="882" y="530" text-anchor="middle" class="badge-text">적립</text>

  <text x="54" y="880" class="note">화살표는 참조하는 행에서 부모 행을 향한다. Redis 대기실 상태와 메시지 Outbox는 이 관계형 개요에서 의도적으로 제외했다.</text>
</svg>
