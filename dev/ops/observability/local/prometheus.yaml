global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: portfolio

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: otel-gateway
    static_configs:
      - targets:
          - otel-gateway:8889
