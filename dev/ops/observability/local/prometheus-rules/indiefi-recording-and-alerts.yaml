groups:
  - name: indiefi-recording
    interval: 15s
    rules:
      - record: indiefi:http_request_rate:5m
        expr: sum(rate(http_server_request_duration_seconds_count[5m]))
      - record: indiefi:http_error_ratio:5m
        expr: sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count[5m])), 0.001)
      - record: indiefi:http_p95_seconds:5m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket[5m])))
      - record: indiefi:rabbitmq_ready_total
        expr: sum(rabbitmq_queue_messages_ready{queue=~"indiefi.*"})

  - name: indiefi-user-impact
    interval: 15s
    rules:
      - alert: IndieFiHttpErrorRatioWarning
        expr: indiefi:http_error_ratio:5m >= 0.01
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Unexpected HTTP 5xx ratio is at least 1%
          action: Stop the next load stage and inspect route traces and dependencies.
      - alert: IndieFiHttpErrorRatioCritical
        expr: indiefi:http_error_ratio:5m >= 0.05
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Unexpected HTTP 5xx ratio is at least 5%
          action: Abort the current load stage, cool down, and run the consistency audit.
      - alert: IndieFiHttpP95Warning
        expr: indiefi:http_p95_seconds:5m > 1
        for: 60s
        labels:
          severity: warning
        annotations:
          summary: Overall HTTP p95 is above one second
          action: Compare route p95 with DB and Redis latency before raising load.
      - alert: IndieFiReadinessUnknownOrFailed
        expr: indiefi_notifications_rabbitmq_ready < 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Worker RabbitMQ readiness is failed or unknown
          action: Stop the load stage and inspect Worker logs and RabbitMQ health.

  - name: indiefi-host-and-data
    interval: 15s
    rules:
      - alert: IndieFiHostCpuWarning
        expr: 1 - (sum(rate(system_cpu_time_seconds_total{state="idle"}[5m])) / sum(rate(system_cpu_time_seconds_total[5m]))) > 0.90
        for: 60s
        labels:
          severity: warning
        annotations:
          summary: Host CPU utilization is above 90%
          action: Hold the current stage and compare CPU with latency and queue growth.
      - alert: IndieFiHostCpuCritical
        expr: 1 - (sum(rate(system_cpu_time_seconds_total{state="idle"}[5m])) / sum(rate(system_cpu_time_seconds_total[5m]))) > 0.95
        for: 120s
        labels:
          severity: critical
        annotations:
          summary: Host CPU utilization is above 95%
          action: Abort when latency or queue depth is still increasing.
      - alert: IndieFiHostMemoryWarning
        expr: sum(system_memory_usage_bytes{state=~"free|cached"}) < 805306368
        for: 60s
        labels:
          severity: warning
        annotations:
          summary: Host available memory estimate is below 768 MiB
          action: Inspect process and container working sets before raising load.
      - alert: IndieFiHostMemoryCritical
        expr: sum(system_memory_usage_bytes{state=~"free|cached"}) < 536870912
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: Host available memory estimate is below 512 MiB
          action: Abort the load stage and check for OOM or sustained reclaim.
      - alert: IndieFiRootDiskWarning
        expr: sum(system_filesystem_usage_bytes{mountpoint="/", state="used"}) / clamp_min(sum(system_filesystem_usage_bytes{mountpoint="/", state=~"used|free|reserved"}), 1) > 0.75
        for: 60s
        labels:
          severity: warning
        annotations:
          summary: Root filesystem usage is above 75%
          action: Do not generate dumps or increase load until disk growth is understood.
      - alert: IndieFiRootDiskCritical
        expr: sum(system_filesystem_usage_bytes{mountpoint="/", state="used"}) / clamp_min(sum(system_filesystem_usage_bytes{mountpoint="/", state=~"used|free|reserved"}), 1) > 0.85
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Root filesystem usage is above 85%
          action: Abort the session safely and preserve only required evidence.
      - alert: IndieFiPostgreSqlDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL exporter cannot reach the database
          action: Stop the load and inspect PostgreSQL health before any recovery action.
      - alert: IndieFiPostgreSqlConnectionsWarning
        expr: sum(pg_stat_activity_count{datname="indiefi"}) / clamp_min(max(pg_settings_max_connections), 1) >= 0.80
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL connection count reached the initial 80% boundary
          action: Inspect connection pooling and long transactions before raising load.
      - alert: IndieFiPostgreSqlLockRisk
        expr: max(pg_stat_activity_max_tx_duration{datname="indiefi", state=~"active|idle in transaction"}) > 5 and sum(pg_locks_count{datname="indiefi", mode=~"rowexclusivelock|sharerowexclusivelock|exclusivelock|accessexclusivelock"}) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL has a long transaction holding a write or exclusive lock
          action: Inspect normalized DB spans and lock holders without exposing query values; confirm an actual waiter in pg_stat_activity.
      - alert: IndieFiRedisDown
        expr: redis_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Redis exporter cannot reach Redis
          action: Stop waiting-room load and inspect Redis health and AOF state.

  - name: indiefi-async
    interval: 15s
    rules:
      - alert: IndieFiRabbitQueueWarning
        expr: indiefi:rabbitmq_ready_total >= 1000
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: IndieFi RabbitMQ ready messages reached 1,000
          action: Hold load and compare consumer throughput with queue growth.
      - alert: IndieFiRabbitQueueCritical
        expr: indiefi:rabbitmq_ready_total >= 10000
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: IndieFi RabbitMQ ready messages reached 10,000
          action: Abort load and allow a bounded cool-down before the consistency audit.
      - alert: IndieFiRabbitConsumersMissing
        expr: indiefi:rabbitmq_ready_total > 0 and sum(rabbitmq_queue_consumers{queue=~"indiefi.*"}) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: RabbitMQ has pending IndieFi messages but no consumers
          action: Inspect Worker state and do not manually purge queues.
      - alert: IndieFiNotificationOutboxBacklog
        expr: indiefi_notifications_outbox_backlog > 0
        for: 60s
        labels:
          severity: warning
        annotations:
          summary: Transactional notification Outbox is not draining
          action: Inspect RabbitMQ readiness and Worker traces.
      - alert: IndieFiNotificationDeliveryFailed
        expr: indiefi_notifications_email_failed > 0
        for: 60s
        labels:
          severity: warning
        annotations:
          summary: Notification email deliveries remain failed
          action: Inspect bounded SES outcome and retry state; do not expose recipient data.
      - alert: IndieFiMediaFailed
        expr: indiefi_media_failed > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Media assets remain in Failed state
          action: Stop media load and inspect Worker and R2 traces before retrying.
