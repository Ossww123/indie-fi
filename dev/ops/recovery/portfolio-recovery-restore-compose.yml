name: indiefi-recovery-restore

services:
  db:
    image: postgres:18
    container_name: indiefi-recovery-db
    restart: "no"
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${RESTORE_POSTGRES_USER:?set RESTORE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:?set RESTORE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RESTORE_POSTGRES_DB:?set RESTORE_POSTGRES_DB}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - recovery-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  minio:
    # Last published community image. It is permitted only for this loopback,
    # short-lived restore lab; see README for the known write-CVE boundary.
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: indiefi-recovery-minio
    command: server /data --console-address ":9001"
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${RESTORE_MINIO_ROOT_USER:?set RESTORE_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${RESTORE_MINIO_ROOT_PASSWORD:?set RESTORE_MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - recovery-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  key-init:
    profiles: ["application"]
    image: postgres:18
    container_name: indiefi-recovery-key-init
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -o 1654 -g 1654 -m 0600 /source/account-protection.json /target/account-protection.json
        install -o 1654 -g 1654 -m 0640 /source/data-protection.crt /target/data-protection.crt
        install -o 1654 -g 1654 -m 0600 /source/data-protection.key /target/data-protection.key
    volumes:
      - ${RECOVERY_KEYS_PATH:?set RECOVERY_KEYS_PATH}:/source:ro
      - recovery-key-data:/target

  web:
    profiles: ["application"]
    build:
      context: ../..
      dockerfile: ops/recovery/Dockerfile.restore-web
    image: indiefi-recovery-web:local
    container_name: indiefi-recovery-web
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      AllowedHosts: 127.0.0.1;localhost
      ConnectionStrings__Database: Host=db;Port=5432;Database=${RESTORE_POSTGRES_DB};Username=${RESTORE_POSTGRES_USER};Password=${RESTORE_POSTGRES_PASSWORD}
      ReverseProxy__KnownProxies__0: 127.0.0.1
      Observability__Enabled: "false"
      Authentication__Google__Enabled: "false"
      AuthenticationEmail__Enabled: "false"
      NotificationEmail__Enabled: "false"
      NotificationMaintenance__Enabled: "false"
      NotificationOperations__Enabled: "false"
      WaitingRoom__Redis__Enabled: "false"
      Messaging__RabbitMq__Enabled: "false"
      # Production rejects plain-HTTP object storage. MinIO content is verified
      # directly by the restore tool; application media flow remains a manual drill.
      Media__ObjectStorage__Enabled: "false"
      Media__ObjectStorage__ServiceUrl: http://minio:9000
      Media__ObjectStorage__Region: auto
      Media__ObjectStorage__BucketName: ${RESTORE_BUCKET}
      Media__ObjectStorage__AccessKeyId: ${RESTORE_MINIO_ROOT_USER}
      Media__ObjectStorage__SecretAccessKey: ${RESTORE_MINIO_ROOT_PASSWORD}
      Media__ObjectStorage__ForcePathStyle: "true"
      Media__Worker__Enabled: "false"
      AccountProtectionKeyFile__Path: /etc/indiefi/keys/account-protection.json
      DataProtectionKeyManagement__CertificatePath: /etc/indiefi/keys/data-protection.crt
      DataProtectionKeyManagement__PrivateKeyPath: /etc/indiefi/keys/data-protection.key
    ports:
      - "127.0.0.1:5500:8080"
    volumes:
      - recovery-key-data:/etc/indiefi/keys:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      key-init:
        condition: service_completed_successfully

volumes:
  recovery-postgres-data:
    name: indiefi-recovery-restore-postgres-data
  recovery-minio-data:
    name: indiefi-recovery-restore-minio-data
  recovery-key-data:
    name: indiefi-recovery-restore-key-data
