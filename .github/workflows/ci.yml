name: ci

# Tests run on every push and pull request, on every branch. Listing branches here means
# a new branch prefix silently stops being covered until someone remembers to add it.
#
# Deploying is a button press instead of a consequence of pushing, because the demo box is
# kept stopped between sessions to hold the bill near a couple of dollars a month. Wiring
# it to pushes on main would turn "the box is off" into a red run on every merge, and a
# pipeline that is normally red is a pipeline nobody reads.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate operation scripts
        run: bash -n dev/ops/*.sh

      # Build the whole solution rather than letting `dotnet test` build only what
      # the tests need. That is what catches a project which stopped compiling but
      # is not referenced by any test - it happened once and went unnoticed for
      # several commits.
      - name: Build
        run: dotnet build dev/IndieFi.slnx

      # The browser contracts render the real production CSS and client bundles in
      # headless Chromium. Playwright versions and their browser binaries move as a
      # pair, so install through the script produced by the just-built test project.
      - name: Install the frontend test browser
        run: pwsh dev/tests/IndieFi.Web.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # The tests start a throwaway PostgreSQL through Testcontainers, so this needs
      # Docker. ubuntu-latest runners already have it. The first run also pulls the
      # postgres:18 image, so expect it to take far longer than the 2s it takes locally.
      - name: Test
        run: dotnet test dev/IndieFi.slnx --no-build

  # Both jobs live in one file so that this one can wait for the other. Copying the test
  # steps into a second file would work until someone edited one copy: the deploy gate
  # would keep passing while testing something older than what is being shipped.
  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # A second button press waits instead of letting two runners migrate and move
    # the same current symlink at once.
    concurrency:
      group: portfolio-production-deployment
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Both projects target the existing x86_64 Ubuntu host and remain framework-
      # dependent, so the server must already have the .NET 10 and ASP.NET Core 10
      # runtimes. Separate folders prevent files with the same dependency name from
      # overwriting each other before they are packaged.
      #
      # SourceRevisionId ends up appended to the assembly's informational version, which is
      # where the footer reads it from. The SDK would infer the same value from the checkout
      # on its own; passing it explicitly ties the footer to the commit this run reports, so
      # the page and the run that produced it can never name different commits.
      - name: Publish Web for Linux x64
        run: |
          mkdir -p release/web
          dotnet publish dev/src/IndieFi.Web \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            --output release/web \
            -p:SourceRevisionId=${{ github.sha }}

      - name: Publish Worker for Linux x64
        run: |
          mkdir -p release/worker
          dotnet publish dev/src/IndieFi.Worker \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            --output release/worker \
            -p:SourceRevisionId=${{ github.sha }}

      # The server has no SDK and no source, so it cannot run migrations the way a laptop
      # does. This bakes them into one executable instead.
      #
      # -r is short for --target-runtime here and not for --runtime, which is a different
      # option: passing the wrong one produces a Windows executable that builds cleanly and
      # only fails once it reaches the server. The RID restore has to come first, otherwise
      # the build stops at NETSDK1047, and it does not survive between builds.
      - name: Build the migration bundle
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          export PATH="$PATH:$HOME/.dotnet/tools"

          dotnet restore dev/src/IndieFi.Web -r linux-x64
          dotnet ef migrations bundle \
            --project dev/src/IndieFi.Web \
            --target-runtime linux-x64 \
            --configuration Release \
            --output release/efbundle \
            --force

          file release/efbundle

      # The manifest binds every executable, dependency, and host template to this
      # commit. The server verifies the archive and then every extracted file before
      # it runs anything with sudo.
      - name: Package one immutable release
        run: |
          cp -a dev/ops release/ops
          printf '%s\n' "$GITHUB_SHA" > release/release.sha

          test -f release/web/IndieFi.Web.dll
          test -f release/worker/IndieFi.Worker.dll
          test -x release/efbundle
          test -x release/ops/deploy-portfolio-release.sh
          test -x release/ops/migrate-portfolio-database.sh
          test -x release/ops/configure-portfolio-database-role.sh
          test -x release/ops/generate-portfolio-key-material.sh

          if find release -type l -print -quit | grep -q .; then
            echo "Release packages may not contain symlinks." >&2
            exit 1
          fi

          (
            cd release
            find web worker ops -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum
            sha256sum efbundle release.sha
          ) > release/SHA256SUMS

          tar \
            --create \
            --gzip \
            --file "$GITHUB_SHA.tar.gz" \
            --directory release \
            .
          sha256sum "$GITHUB_SHA.tar.gz" > "$GITHUB_SHA.tar.gz.sha256"

          file \
            release/web/IndieFi.Web \
            release/worker/IndieFi.Worker \
            release/efbundle

      # Everything above takes tens of seconds and needs nothing from the server, so
      # port 22 stays shut until here. The role only trusts a subject carrying GitHub's
      # immutable owner and repo ids (repo:owner@id/name@id:...), not the plain
      # repo:owner/name form most examples show; renaming the repository breaks this.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Find the runner public IP
        run: |
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com)"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"

      # Only this short-lived runner needs port 22. The description makes the rule
      # recognizable if a failed cleanup leaves it for someone to remove by hand.
      - name: Allow SSH from the runner
        env:
          AWS_SG_ID: ${{ secrets.AWS_SG_ID }}
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "$AWS_SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=github-actions-deploy}]"
          echo "SSH_INGRESS_ADDED=true" >> "$GITHUB_ENV"

      # The private key remains on the runner disk for the rest of this job. GitHub
      # discards the runner afterward, but the key must never be printed to the log.
      # The config file is here so that every ssh and scp line below stays short
      # enough to read at a glance.
      #
      # The EC2 public IP changes when the instance is restarted, so pinning a host
      # key to that IP would break on each change. accept-new records the first key
      # this throwaway runner sees, but it cannot detect a man-in-the-middle on that
      # first connection; that is the known cost of the choice.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          cat > "$HOME/.ssh/config" <<EOF
          Host deploy-target
            HostName $SSH_HOST
            User ubuntu
            IdentityFile $HOME/.ssh/deploy_key
            StrictHostKeyChecking accept-new
          EOF

      # The upload directory is outside /opt and is owned by the unprivileged SSH user.
      # No running release is touched until the remote script has verified both hashes.
      - name: Upload the release archive
        run: |
          ssh deploy-target 'install -d -m 0755 ~/indiefi-upload'
          # GITHUB_SHA deliberately expands on the trusted runner; the remote command
          # receives only the resulting 40-character hexadecimal filename.
          # shellcheck disable=SC2029
          ssh deploy-target \
            "rm -f -- ~/indiefi-upload/$GITHUB_SHA.tar.gz ~/indiefi-upload/$GITHUB_SHA.tar.gz.sha256"
          scp \
            "$GITHUB_SHA.tar.gz" \
            "$GITHUB_SHA.tar.gz.sha256" \
            deploy-target:~/indiefi-upload/

      # The remote script installs the matching service templates, validates all three
      # environment files, stops Worker then Web, migrates, atomically moves current,
      # and starts Web then Worker. It leaves failures visible instead of automatically
      # rolling code back across a schema migration.
      - name: Migrate and activate Web and Worker
        run: |
          ssh deploy-target \
            bash -s -- "$GITHUB_SHA" \
            < dev/ops/deploy-portfolio-release.sh

      # always() covers ordinary failures above, but a forced workflow cancellation
      # can prevent cleanup from running. The described ingress rule then remains
      # and must be removed by hand. The marker avoids deleting a pre-existing rule
      # when this run did not successfully add one.
      - name: Remove SSH access from the runner
        if: always()
        env:
          AWS_SG_ID: ${{ secrets.AWS_SG_ID }}
        run: |
          if [ "${SSH_INGRESS_ADDED:-}" != "true" ]; then
            exit 0
          fi

          aws ec2 revoke-security-group-ingress \
            --group-id "$AWS_SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32"
